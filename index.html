<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastBite - Order Online</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass border-b border-slate-800">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="bg-amber-500 text-slate-950 p-2 rounded-xl text-xl font-black">🔥</span>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white">Fast<span class="text-amber-500">Bite</span></h1>
                    <p class="text-xs text-slate-400">Peshawar's Gourmet Fast Food</p>
                </div>
            </div>
            
            <button onclick="toggleCart()" class="relative bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl flex items-center space-x-2 transition">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Cart</span>
                <span id="cart-count" class="bg-slate-950 text-amber-500 text-xs px-2 py-0.5 rounded-full font-extrabold">0</span>
            </button>
        </div>
    </header>

    <!-- Banner Hero -->
    <div class="max-w-4xl mx-auto px-4 mt-6">
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-amber-500 to-orange-600 p-6 md:p-8 text-slate-950 shadow-2xl">
            <div class="relative z-10">
                <span class="bg-slate-950 text-amber-400 text-xs font-extrabold uppercase tracking-widest px-3 py-1 rounded-full">Special Deal</span>
                <h2 class="text-3xl font-extrabold mt-2 leading-tight">Craving Hot & Juicy Burgers?</h2>
                <p class="text-slate-900 font-medium text-sm mt-1">Get 20% off on your first WhatsApp order today!</p>
            </div>
            <i class="fa-solid fa-burger absolute -right-4 -bottom-4 text-9xl text-slate-950 opacity-15"></i>
        </div>
    </div>

    <!-- Category Filter Tabs -->
    <div class="max-w-4xl mx-auto px-4 mt-6">
        <div class="flex space-x-3 overflow-x-auto pb-2 custom-scrollbar text-sm font-semibold">
            <button onclick="filterCategory('all')" class="cat-btn bg-amber-500 text-slate-950 px-5 py-2 rounded-xl whitespace-nowrap font-bold">All Items</button>
            <button onclick="filterCategory('burgers')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-5 py-2 rounded-xl whitespace-nowrap">Burgers</button>
            <button onclick="filterCategory('pizza')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-5 py-2 rounded-xl whitespace-nowrap">Pizzas</button>
            <button onclick="filterCategory('sides')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-5 py-2 rounded-xl whitespace-nowrap">Sides & Drinks</button>
        </div>
    </div>

    <!-- Menu Grid -->
    <main class="max-w-4xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-2 gap-4" id="menu-grid">
        <!-- JS menu items dynamically inject hongy -->
    </main>

    <!-- Cart Drawer Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex justify-end">
        <div class="bg-slate-900 w-full max-w-md h-full flex flex-col p-6 shadow-2xl border-l border-slate-800">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h3 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-amber-500"></i> Your Cart</h3>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>

            <!-- Cart Items List -->
            <div id="cart-items" class="flex-1 overflow-y-auto py-4 space-y-3 custom-scrollbar">
                <!-- Cart items dynamically populate hongy -->
            </div>

            <!-- Checkout Form & Summary -->
            <div class="border-t border-slate-800 pt-4 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Your Name</label>
                    <input type="text" id="customer-name" placeholder="e.g. Saad Waqas" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Delivery Address</label>
                    <input type="text" id="customer-address" placeholder="e.g. House #12, Wapda Town, Peshawar" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>

                <div class="flex justify-between items-center pt-2 text-lg font-bold">
                    <span>Total Amount:</span>
                    <span id="cart-total" class="text-amber-500">PKR 0</span>
                </div>

                <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg shadow-emerald-950">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Place Order on WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // TARGET WHATSAPP NUMBER
        const WHATSAPP_NUMBER = "923185524288";

        // Menu Data
        const menuItems = [
            { id: 1, name: "Zinger Crunch Burger", category: "burgers", price: 550, desc: "Crispy fried chicken breast with iceberg lettuce & spicy mayo.", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Smoky Beef Smash", category: "burgers", price: 750, desc: "Double smash beef patty, caramelized onions & cheddar cheese.", img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Chicken Pepperoni Pizza", category: "pizza", price: 1200, desc: "Loaded with mozzarella, pepperoni slice, and oregano.", img: "https://images.unsplash.com/photo-1534308983496-4fabb1a015ee?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "BBQ Smoked Pizza", category: "pizza", price: 1350, desc: "Smoked chicken chunks, green peppers, & BBQ drizzle.", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=80" },
            { id: 5, name: "Loaded Cheese Fries", category: "sides", price: 380, desc: "Crispy fries smothered in liquid cheddar & jalapenos.", img: "https://images.unsplash.com/photo-1585109649139-366815a0d713?auto=format&fit=crop&w=500&q=80" },
            { id: 6, name: "Chilled Choco Shake", category: "sides", price: 300, desc: "Thick creamy chocolate ice cream shake with chocochips.", img: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];

        // Render Menu Grid
        function renderMenu(items = menuItems) {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = items.map(item => `
                <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden flex flex-col justify-between hover:border-slate-700 transition">
                    <img src="${item.img}" alt="${item.name}" class="w-full h-40 object-cover">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-lg">${item.name}</h3>
                                <span class="bg-amber-500/10 text-amber-500 text-xs font-extrabold px-2 py-1 rounded-lg">PKR ${item.price}</span>
                            </div>
                            <p class="text-slate-400 text-xs mt-1 leading-relaxed">${item.desc}</p>
                        </div>
                        <button onclick="addToCart(${item.id})" class="mt-4 w-full bg-slate-800 hover:bg-amber-500 hover:text-slate-950 font-semibold py-2 rounded-xl text-xs transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Category Filter Function
        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-5 py-2 rounded-xl whitespace-nowrap";
            });
            event.target.className = "cat-btn bg-amber-500 text-slate-950 px-5 py-2 rounded-xl whitespace-nowrap font-bold";
            
            if(cat === 'all') renderMenu(menuItems);
            else renderMenu(menuItems.filter(i => i.category === cat));
        }

        // Cart Management
        function addToCart(id) {
            const item = menuItems.find(i => i.id === id);
            const exist = cart.find(i => i.id === id);
            if(exist) exist.qty += 1;
            else cart.push({ ...item, qty: 1 });
            updateCartUI();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = `PKR ${total}`;

            const container = document.getElementById('cart-items');
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center text-sm py-8">Your cart is empty.</p>`;
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <div>
                            <h4 class="font-bold text-sm">${item.name}</h4>
                            <p class="text-amber-500 text-xs font-semibold">PKR ${item.price * item.qty}</p>
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-900 rounded-lg px-2 py-1">
                            <button onclick="updateQty(${item.id}, -1)" class="text-slate-400 hover:text-white px-1">-</button>
                            <span class="text-xs font-bold px-1">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="text-slate-400 hover:text-white px-1">+</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        // Send Order via WhatsApp Link
        function sendWhatsAppOrder() {
            if(cart.length === 0) {
                alert("Please add at least one item to your cart.");
                return;
            }

            const name = document.getElementById('customer-name').value.trim();
            const address = document.getElementById('customer-address').value.trim();

            if(!name || !address) {
                alert("Please enter your Name and Address.");
                return;
            }

            let msg = `*NEW ORDER - FASTBITE*\n\n`;
            msg += `*Customer Name:* ${name}\n`;
            msg += `*Address:* ${address}\n\n`;
            msg += `*ORDER DETAILS:*\n`;

            cart.forEach(item => {
                msg += `• ${item.name} (x${item.qty}) - PKR ${item.price * item.qty}\n`;
            });

            const total = cart.rootCart ? 0 : cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            // safe total calculation
            const finalTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            msg += `\n*TOTAL AMOUNT:* PKR ${finalTotal}\n`;
            msg += `----------------------------\n`;
            msg += `Sent via FastBite Web App`;

            const encodedMsg = encodeURIComponent(msg);
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMsg}`, '_blank');
        }

        // Initialize App
        renderMenu();
    </script>
</body>
</html>
